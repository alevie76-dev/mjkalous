# Decap CMS configuration: https://decapcms.org/docs/configuration-options/
backend:
  name: github
  repo: alevie76-dev/mjkalous # <owner>/<repo> — update if the repo moves (see INFRASTRUCTURE.md)
  branch: main
  auth_endpoint: api/auth # base_url is set to the current site in index.html
  commit_messages:
    create: 'Blog: create “{{slug}}”'
    update: 'Blog: update “{{slug}}”'
    delete: 'Blog: delete “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

site_url: https://mjkalous.com
display_url: https://mjkalous.com
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    delete: true
    format: yaml-frontmatter
    frontmatter_delimiter: '---'
    extension: md
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'blog/{{slug}}'
    summary: '{{date}} — {{title}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    editor:
      preview: true
    fields:
      - { name: title, label: Post Title, widget: string }
      - name: date
        label: Publish Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      # Choices come from the Settings → Categories list (src/data/categories.json).
      - name: categories
        label: Categories
        widget: relation
        collection: settings
        file: categories
        search_fields: ['categories.*.name']
        value_field: 'categories.*.name'
        display_fields: ['categories.*.name']
        multiple: true
        min: 1
        options_length: 50
        hint: 'Need a new category? Add it under Settings → Categories, then come back to this post.'
      - { name: tags, label: Tags, widget: list, required: false, hint: 'Separate tags with commas.' }
      - { name: heroImage, label: Hero Image, widget: image, required: false, choose_url: false }
      - name: heroImageAlt
        label: Hero Image Description
        widget: string
        required: false
        hint: 'Describe the picture for people using screen readers, e.g. “A magpie in flight over sagebrush.”'
      - name: excerpt
        label: Post Excerpt
        widget: text
        required: false
        hint: 'Used for the search engine description and the post card preview. One or two sentences.'
      - name: draft
        label: Draft (hide from the site)
        widget: boolean
        default: false
        required: false
      - { name: body, label: Post Content, widget: markdown }

  - name: settings
    label: Settings
    delete: false
    editor:
      preview: false
    files:
      - name: categories
        label: Categories
        file: src/data/categories.json
        format: json
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            collapsed: false
            summary: '{{fields.name}}'
            hint: 'The choices in the Categories drop-down on each post. Renaming one here does not change posts that already use the old name.'
            fields:
              - { name: name, label: Name, widget: string }
